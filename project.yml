name: IOS_CONDO_BLOX
options:
  bundleIdPrefix: com.noobscons
  deploymentTarget:
    iOS: "15.0"
targets:
  IOS_CONDO_BLOX:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 🚨 This line forces Xcode to include the USDZ file in the IPA
      - path: character_files
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.noobscons.robloxclone
