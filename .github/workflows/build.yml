name: Build iOS (Unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

env:
  GODOT_VERSION: 4.4.1-stable 
  IOS_PRESET: iOS
  APP_NAME: ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-latest 
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SCons
        run: |
          brew install scons

      - name: Setup godot-cpp
        run: |
          git clone https://github.com/godotengine/godot-cpp.git
          cd godot-cpp
          git checkout godot-4.4-stable

      # 🚨 NEW: This saves the compiled engine so you don't rebuild it!
      - name: Cache godot-cpp compiled files
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            .sconsign.dblite
          key: ${{ runner.os }}-godot-cpp-${{ env.GODOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-godot-cpp-${{ env.GODOT_VERSION }}-

      - name: Download Game Assets
        run: |
          mkdir -p character_files textures
          curl -L "https://github.com/noobscons-prog/IOS_CONDO_BLOX/raw/refs/heads/main/character_files/r6_default_character.fbx" -o character_files/r6_default_character.fbx
          curl -L "https://github.com/noobscons-prog/IOS_CONDO_BLOX/raw/refs/heads/main/textures/stud_texture.jpeg" -o textures/stud_texture.jpeg

      - name: Build godot-cpp (iOS)
        run: |
          cd godot-cpp
          scons platform=ios target=template_release arch=arm64
          cd ..

      - name: Build GDExtension (iOS)
        run: |
          scons platform=ios target=template_release arch=arm64

      - name: Download Godot Headless
        run: |
          curl -L "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o godot.zip
          unzip -q godot.zip -d godot

      - name: Export to Xcode Project
        run: |
          mkdir -p build/ios
          godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "${IOS_PRESET}" build/ios/${APP_NAME}.xcodeproj

      - name: xcodebuild Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project build/ios/${APP_NAME}.xcodeproj \
            -scheme "${APP_NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${APP_NAME}.ipa" Payload
          mv "${APP_NAME}.ipa" ../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.APP_NAME }}.ipa
